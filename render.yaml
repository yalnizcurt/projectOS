services:
  - type: web
    name: erp-delivery-control-tower
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_LLM_PROVIDER
        value: groq
      - key: VITE_GROQ_MODEL
        value: openai/gpt-oss-120b
